<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>折叠区块研究</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>折叠区块研究</h1>
    <p>研究details与summary元素的用法和open属性</p>
  </header>
  <nav>
    <a href="#intro">研究说明</a>
    <a href="#demo">折叠演示</a>
  </nav>
  <main>
    <section id="intro">
      <h2>研究说明</h2>
      <p>本页面研究details和summary元素。点击标题可以展开或折叠内容。加了open属性的默认展开，没加的默认折叠。</p>
    </section>
    <section id="demo">
      <h2>折叠演示</h2>
      <details open>
        <summary>填写说明</summary>
        <p>这是一个可折叠的填写说明区块，点击标题可以展开或折叠。</p>
        <p>填写时请注意：带*号为必填项，借阅前请确认图书信息无误。</p>
        <p>每次最多借阅5本，借阅期限为30天，可续借一次。</p>
      </details>
    </section>
  </main>
  <footer>
    <p>软件开发综合实践 · 研究任务三</p>
  </footer>
</body>
</html>
